name: Build Android APK (طبيب الغيط)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك الضغط على زر "Run workflow" يدوياً في أي وقت

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Native Platform Files
        run: flutter create . --platforms=android --org=com.tabibelgheit --project-name=tabib_el_gheit

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabib-el-gheit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
